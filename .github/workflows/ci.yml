name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd ../portfolio-contracts && npm ci && npm run build
          cd ../portfolio-tax-engine && npm ci && npm run build
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/batch-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Upload package artifact
        run: tar -czf portfolio-batch.tar.gz dist package.json
      - uses: actions/upload-artifact@v4
        with:
          name: batch-package
          path: portfolio-batch.tar.gz
