name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# develop → deploy-dev.yml (Azure dev) | main → deploy-prod.yml (Azure prod)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio-batch

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-contracts
          path: portfolio-contracts

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-tax-engine
          path: portfolio-tax-engine

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and verify batch
        working-directory: portfolio-batch
        run: |
          cd ../portfolio-contracts && npm ci && npm run build
          cd ../portfolio-tax-engine && npm ci && npm run build
          npm ci
          npm test
          npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/batch-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio-batch

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-contracts
          path: portfolio-contracts

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-tax-engine
          path: portfolio-tax-engine

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build release artifact
        working-directory: portfolio-batch
        run: |
          cd ../portfolio-contracts && npm ci && npm run build
          cd ../portfolio-tax-engine && npm ci && npm run build
          npm ci && npm run build
          tar -czf portfolio-batch.tar.gz dist package.json

      - uses: actions/upload-artifact@v4
        with:
          name: batch-package
          path: portfolio-batch/portfolio-batch.tar.gz
